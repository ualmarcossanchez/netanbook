name: CI

# Compila los dos productos de Netanbook en los tres sistemas:
# - macOS: los dos schemes del proyecto de Xcode (Netanbook y Netanbook Progreso).
# - Linux y Windows (Swift 6.3): Package.swift sin traits y con --traits Progreso,
#   comprobación de que el código de F1 solo está en el ejecutable compilado con
#   Progreso y arranque de los dos productos.
# - Windows prueba además la interfaz de los dos productos (scripts/probar-interfaz.ps1):
#   entra en el detalle de un libro, lo edita y vuelve al listado. Al lanzar el
#   workflow a mano, o si el mensaje del commit contiene [capturas], sube las
#   capturas a docs/sesion-N/capturas.
# Los resultados de las comprobaciones salen como anotaciones en la página del workflow.
on:
  push:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Compilar los dos schemes del proyecto de Xcode
        run: |
          for scheme in "Netanbook" "Netanbook Progreso"; do
            xcodebuild -project Netanbook.xcodeproj -scheme "$scheme" -destination 'platform=macOS' build CODE_SIGNING_ALLOWED=NO
          done

  linux:
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias (GTK 4 y pantalla virtual)
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libgtk-4-dev libfontconfig-dev xvfb imagemagick fonts-dejavu
      - name: Compilar, comprobar F1 y arrancar los dos productos
        run: |
          export DISPLAY=:99 GDK_BACKEND=x11 GSK_RENDERER=cairo LANG=C.UTF-8 LC_ALL=C.UTF-8
          Xvfb :99 -screen 0 1280x800x24 2>/dev/null &
          sleep 2
          mkdir -p shots
          for variante in base Progreso; do
            opciones=""
            [ "$variante" = Progreso ] && opciones="--traits Progreso"
            if ! swift build --product Netanbook $opciones > shots/build-$variante.log 2>&1; then
              cat shots/build-$variante.log
              grep -m 5 'error:' shots/build-$variante.log | sed "s/^/::error title=swift build $variante::/"
              exit 1
            fi
            cat shots/build-$variante.log
            exe="$(swift build --product Netanbook $opciones --show-bin-path)/Netanbook"
            # Apariciones del tipo de F1, sin contar el nombre del fichero
            # ReadingProgressViewModel.swift: se compila siempre (vacío sin la
            # variable) y la información de depuración guarda su nombre.
            count=$(strings "$exe" | grep -oP 'ReadingProgressViewModel(?!\.swift)' | wc -l)
            echo "::notice title=F1 en Linux ($variante)::ReadingProgressViewModel aparece $count veces en el ejecutable"
            if [ "$variante" = base ] && [ "$count" -ne 0 ]; then echo "::error::El producto base contiene código de F1"; exit 1; fi
            if [ "$variante" = Progreso ] && [ "$count" -eq 0 ]; then echo "::error::Netanbook Progreso no contiene el código de F1"; exit 1; fi
            "$exe" > shots/$variante.log 2>&1 &
            app=$!
            sleep 5
            if ! kill -0 $app; then
              cat shots/$variante.log
              echo "::error::El producto $variante se ha cerrado al arrancar: $(tail -n 3 shots/$variante.log | tr '\n' ' ')"
              exit 1
            fi
            import -window root shots/$variante.png
            kill $app
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-ui
          path: shots

  windows:
    runs-on: windows-latest
    # Para guardar las capturas en el repositorio (a mano o con [capturas] en el commit).
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-vsdevenv@v5
      - uses: compnerd/gha-setup-swift@v0.3.0
        with:
          branch: swift-6.3.3-release
          tag: 6.3.3-RELEASE
      - uses: actions/cache@v4
        with:
          path: .build
          key: windows-build-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: windows-build-
      - name: Compilar los dos productos y comprobar dónde está F1
        run: ./scripts/comprobar-f1.ps1
      - name: Probar la interfaz de los dos productos (detalle del libro) y capturarla
        run: |
          ./scripts/probar-interfaz.ps1 -Variante base
          ./scripts/probar-interfaz.ps1 -Variante Progreso
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui
          path: |
            docs/sesion-*/capturas/*.png
            shots
      - name: Guardar las capturas en el repositorio (a mano o con [capturas] en el commit)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[capturas]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/*/capturas/*.png"
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Capturas de los dos productos generadas por la CI en Windows [skip ci]"
            git push origin "HEAD:$env:GITHUB_REF_NAME"
          }
